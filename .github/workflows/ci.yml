name: CI/CD Quality, Platform & Evaluation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      eval_mode:
        description: 'LLM evaluation execution mode (offline | live)'
        required: true
        default: 'offline'
        type: choice
        options:
          - offline
          - live

jobs:
  backend-ci:
    name: Backend Tests & Compile Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: leadershipApp_backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'leadershipApp_backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Syntax & Bytecode Compilation
        run: |
          python -m compileall app tests

      - name: Run Backend Unit & Contract Tests
        run: |
          python -m unittest discover -s tests -q

  eval-gate:
    name: Socratic LLM Quality Gate (Offline Evals)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: leadershipApp_backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'leadershipApp_backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Socratic Evaluation Suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_MODE: ${{ inputs.eval_mode || 'offline' }}
        run: |
          python scripts/run_evals.py \
            --mode "$EVAL_MODE" \
            --output eval_report.json \
            --markdown-summary "$GITHUB_STEP_SUMMARY" \
            --min-pass-rate 0.90 \
            --min-non-directive-score 0.95

      - name: Upload Evaluation Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-evaluation-report
          path: leadershipApp_backend/eval_report.json
          retention-days: 14

  frontend-ci:
    name: Frontend Typecheck, Lint, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: leadershipApp_frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'leadershipApp_frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type-Check
        run: npm run type-check

      - name: ESLint Code Quality Check
        run: npm run lint

      - name: Run Jest Unit Tests
        run: npm test -- --runInBand --ci

      - name: Next.js Production Build
        run: npm run build

